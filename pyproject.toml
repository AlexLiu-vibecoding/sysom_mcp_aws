[project]
name = "sysom-mcp-aws"
version = "0.1.0"
description = "AWS EC2 System Diagnostic MCP Server - Memory, IO, Network, Scheduler, Crash analysis tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "boto3>=1.28.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
